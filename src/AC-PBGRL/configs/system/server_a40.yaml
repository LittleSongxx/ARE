project:
  data_root: /mnt/songensheng/ac-pbgrl
train:
  bf16: true
  # The 20 compressed train shards expand to only a few GiB per learner rank,
  # while this host has ample RAM. Avoid re-decoding them on every update.
  label_cache_shards: 20
gpu_scheduler:
  policy: prefer-idle
  min_gpus: 1
  max_gpus: 4
