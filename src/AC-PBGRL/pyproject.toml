[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ac-pbgrl"
version = "0.1.0"
description = "Action-Conditioned Future-Potential Belief Graph Reinforcement Learning"
readme = "README.md"
requires-python = ">=3.8,<3.13"
dependencies = [
  "numpy==1.24.3",
  "scipy==1.10.1",
  "scikit-image==0.21.0",
  "PyYAML==6.0.3",
  "matplotlib==3.7.5",
  "tensorboard==2.14.0",
]

[project.optional-dependencies]
train = ["torch==2.4.1", "ray==2.10.0", "h5py==3.11.0"]
analysis = ["pandas==2.0.3", "seaborn==0.13.2", "scikit-learn==1.3.2"]
export = ["onnx==1.16.2", "onnxruntime==1.16.3"]
test = ["pytest==8.3.5", "pytest-cov==5.0.0"]

[project.scripts]
ac-pbgrl = "ac_pbgrl.cli:main"

[tool.setuptools.packages.find]
include = ["ac_pbgrl*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "torch: requires PyTorch",
  "integration: integration test",
  "ros: requires ROS Noetic",
  "gpu: requires CUDA",
]
